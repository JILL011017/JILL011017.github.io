<html lang="zh-CN">
<head>

<title>思玥的生活图鉴</title>
<meta name="description" content="陈思玥（Siyue）的个人主页：猫、厨房、钓鱼浮潜、滑雪和麻将。中文・日本語・English">
<meta property="og:title" content="Siyue · 思玥的生活图鉴">
<meta property="og:description" content="猫、厨房、钓鱼浮潜、滑雪和麻将。中文・日本語・English">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F1F2EF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111D28'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-style='italic' font-size='40' fill='%23F1F2EF' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Instrument+Sans:wght@400;500&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500&family=DM+Mono:wght@400&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
/* Layout: a quiet personal magazine. Each chapter opens with one large serif kanji (猫 食 海 雪 雀) that reads the same in all three languages; photos sit in an asymmetric 12-column grid with sharp corners and small captions. */
:root{
  --paper:#F1F2EF;
  --surface:#FAFAF8;
  --ink:#111D28;
  --muted:#5C6771;
  --line:#D3D8D7;
  --accent:#A9351F;     /* bandana red, used sparingly */
  --sea:#1C5B6A;
  --veil:rgba(7,22,34,.62);
  --on-photo:#FFFFFF;

  --f-latin-head:"Bodoni Moda";
  --f-latin-body:"Instrument Sans";
  --f-head:var(--f-latin-head),"Noto Serif SC","Songti SC",serif;
  --f-body:var(--f-latin-body),"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B141C; --surface:#111D27; --ink:#E8EBE8; --muted:#95A1AA; --line:#233240;
    --accent:#E06B51; --sea:#62AEBD; --veil:rgba(3,10,16,.66); --on-photo:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B141C; --surface:#111D27; --ink:#E8EBE8; --muted:#95A1AA; --line:#233240;
  --accent:#E06B51; --sea:#62AEBD; --veil:rgba(3,10,16,.66); --on-photo:#FFFFFF;
  color-scheme:dark;
}
:root:lang(ja){
  --f-head:var(--f-latin-head),"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:var(--f-latin-body),"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
:root:lang(en){
  --f-head:var(--f-latin-head),"Noto Serif SC",serif;
  --f-body:var(--f-latin-body),"Noto Sans SC",sans-serif;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.8;
  padding-inline:24px; padding-block:0 64px;
  -webkit-font-smoothing:antialiased;
}
:root:lang(en) body{line-height:1.65}
h1,h2,h3,p,dl,dd,ul{margin:0}
h1,h2,h3{font-weight:500; text-wrap:balance}
img,video{display:block; max-width:100%}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:4px}
.wrap{max-width:1160px; margin-inline:auto}
main{display:flex; flex-direction:column; gap:128px; margin-top:128px}
@media (max-width:700px){ main{margin-top:96px} }
.i18n-fade main, .i18n-fade .hero{opacity:.15}
main, .hero{transition:opacity .18s ease}

/* ---------- top bar ---------- */
.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  margin-inline:-24px; padding:14px 24px;
}
.bar .wrap{display:flex; align-items:center; justify-content:space-between; gap:20px}
.mark{font-family:"Bodoni Moda",serif; font-style:italic; font-size:26px; line-height:1}
.nav{display:flex; gap:26px; font-size:14px; color:var(--muted)}
.nav a:hover{color:var(--ink)}
.langs{display:flex; border:1px solid var(--line); border-radius:999px; padding:3px}
.langs button{
  font:inherit; font-size:13px; letter-spacing:.04em; color:var(--muted);
  background:none; border:0; border-radius:999px; padding:5px 13px; cursor:pointer;
}
.langs button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}

/* ---------- hero ---------- */
.hero{
  display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:64px; align-items:end;
  padding-block:72px 0;
}
.eyebrow{font-family:var(--f-mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.hero h1{
  font-family:"Bodoni Moda",serif; font-style:italic; font-weight:400;
  font-size:clamp(110px,19vw,240px); line-height:.82; letter-spacing:-.03em; margin-top:22px;
}
.hero h1 i{font-style:normal; color:var(--accent)}
.names{margin-top:18px; font-family:var(--f-head); font-size:19px; letter-spacing:.06em; color:var(--muted)}
.lede{margin-top:36px; font-family:var(--f-head); font-size:clamp(19px,2vw,23px); line-height:1.75; max-width:27em}
:root:lang(en) .lede{line-height:1.5; font-size:clamp(20px,2.2vw,25px)}
.facts{
  margin-top:44px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:32px;
}
.facts div{border-top:1px solid var(--line); padding-block:12px; display:flex; flex-direction:column; gap:2px; min-width:0}
.facts dt{font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.facts dd{font-size:15px}

.cover{display:flex; flex-direction:column; gap:12px; min-width:0}
.cover .frame{overflow:hidden; border-radius:2px; background:var(--line)}
.cover img{width:100%; height:auto; aspect-ratio:4/5; object-fit:cover}
.credit{display:flex; justify-content:space-between; gap:12px; font-family:var(--f-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

/* ---------- chapters ---------- */
section{display:flex; flex-direction:column; gap:40px; scroll-margin-top:84px}
.chap{display:grid; grid-template-columns:auto minmax(0,1fr); gap:28px; align-items:end; border-bottom:1px solid var(--line); padding-bottom:22px}
.glyph{font-family:"Shippori Mincho","Noto Serif SC",serif; font-weight:600; font-size:clamp(84px,11vw,132px); line-height:.9; color:var(--accent)}
.chap h2{font-family:var(--f-head); font-size:clamp(30px,4vw,44px); line-height:1.15}
.chap p{color:var(--muted); font-size:15px; margin-top:8px}
.intro{font-family:var(--f-head); font-size:19px; line-height:1.8; max-width:32em}
:root:lang(en) .intro{line-height:1.55; font-size:20px}

.g{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:40px 22px}
.c4{grid-column:span 4} .c5{grid-column:span 5} .c7{grid-column:span 7} .c8{grid-column:span 8} .c12{grid-column:span 12}
figure{margin:0; display:flex; flex-direction:column; gap:14px; min-width:0}
.frame{overflow:hidden; border-radius:2px; background:var(--line)}
figure .frame img, figure .frame video{width:100%; height:100%; object-fit:cover; transition:transform .8s cubic-bezier(.2,.7,.2,1)}
figure:hover .frame img{transform:scale(1.025)}
.a45 .frame{aspect-ratio:4/5}
.a85 .frame{aspect-ratio:8/5}
.a75 .frame{aspect-ratio:28/25}
.a169 .frame{aspect-ratio:16/9}
figcaption{display:flex; flex-direction:column; gap:4px}
figcaption h3{font-family:var(--f-head); font-size:20px; line-height:1.35}
figcaption p{font-size:15px; color:var(--muted); line-height:1.7; max-width:34em}
.spec{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--sea)}
.spec .bin{font-family:"Bodoni Moda",serif; font-style:italic; font-size:15px; letter-spacing:0; text-transform:none; color:var(--muted)}

.profile{border-top:1px solid var(--ink); padding-top:18px; display:flex; flex-direction:column; gap:16px; min-width:0}
.profile h3{font-family:var(--f-head); font-size:22px}
.profile dl{display:flex; flex-direction:column}
.profile div{display:grid; grid-template-columns:minmax(0,5.5em) minmax(0,1fr); gap:14px; padding-block:11px; border-bottom:1px solid var(--line)}
:root:lang(en) .profile div{grid-template-columns:minmax(0,7.5em) minmax(0,1fr)}
.profile dt{font-family:var(--f-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding-top:4px}
.profile dd{font-size:15px; line-height:1.6}

/* sea banner */
.banner{position:relative; overflow:hidden; border-radius:2px; height:clamp(280px,40vw,480px); background:var(--sea)}
.banner img{width:100%; height:100%; object-fit:cover; object-position:center 64%}
.banner .over{
  position:absolute; inset:auto 0 0 0; padding:36px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:24px; align-items:end;
  background:linear-gradient(to top, var(--veil), transparent); color:var(--on-photo);
}
.banner .glyph{color:var(--on-photo)}
.banner h2{font-family:var(--f-head); font-size:clamp(30px,4vw,44px); line-height:1.15}
.banner p{font-size:15px; opacity:.88; margin-top:8px}

.duo{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:64px; align-items:start}
.stack{display:flex; flex-direction:column; gap:40px}
.invite{border-top:1px solid var(--ink); padding-top:18px; display:flex; flex-direction:column; gap:8px}
.invite h3{font-family:var(--f-head); font-size:26px}
.invite p{color:var(--muted); font-size:15px}

footer{margin-top:128px; border-top:1px solid var(--line); padding-top:28px; display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:16px; color:var(--muted); font-size:14px}
footer .mark{color:var(--ink); font-size:34px}

/* ---------- responsive ---------- */
@media (max-width:960px){
  .nav{display:none}
  .hero{grid-template-columns:minmax(0,1fr); gap:48px; padding-top:48px}
  .cover{max-width:460px}
  .duo{grid-template-columns:minmax(0,1fr); gap:128px}
}
@media (max-width:700px){
  body{padding-inline:18px}
  .bar{margin-inline:-18px; padding-inline:18px}
  main{gap:96px}
  .facts{grid-template-columns:minmax(0,1fr)}
  .g{grid-template-columns:repeat(2,minmax(0,1fr)); gap:32px 12px}
  .g > *{grid-column:span 1}
  .g > .m2{grid-column:span 2}
  .g .a85 .frame, .g .a75 .frame{aspect-ratio:4/3}
  .k-laz{order:1} .k-wing{order:2} .k-fried{order:3}
  .chap{gap:18px}
  .banner .over{padding:22px; gap:16px}
  figcaption h3{font-size:18px}
  figcaption p{font-size:14px}
  footer{margin-top:96px}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="mark" href="#top">Siyue</a>
    <nav class="nav" aria-label="Sections">
      <a href="#cat" data-t="nav.cat"></a>
      <a href="#kitchen" data-t="nav.kitchen"></a>
      <a href="#sea" data-t="nav.sea"></a>
      <a href="#snow" data-t="nav.snow"></a>
      <a href="#mahjong" data-t="nav.mahjong"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" id="lang-zh" data-lang="zh" aria-pressed="false">中文</button>
      <button type="button" id="lang-ja" data-lang="ja" aria-pressed="false">日本語</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<div class="wrap" id="top">

  <section class="hero" aria-label="Siyue">
    <div>
      <div class="eyebrow" data-t="hero.eyebrow"></div>
      <h1>Siyue<i>.</i></h1>
      <div class="names">陈思玥 ／ チン・シゲツ</div>
      <p class="lede" data-t="hero.lede"></p>
      <dl class="facts">
        <div><dt data-t="f.from.k"></dt><dd data-t="f.from.v"></dd></div>
        <div><dt data-t="f.base.k"></dt><dd data-t="f.base.v"></dd></div>
        <div><dt data-t="f.lang.k"></dt><dd>中文 · 日本語 · English</dd></div>
        <div><dt data-t="f.like.k"></dt><dd data-t="f.like.v"></dd></div>
      </dl>
    </div>
    <figure class="cover">
      <div class="frame"><img src="media/cover.jpg" data-alt="alt.cover" alt="" width="1050" height="1400"></div>
      <figcaption class="credit"><span data-t="hero.cover"></span><span>2026</span></figcaption>
    </figure>
  </section>

  <main>

    <!-- CAT -->
    <section id="cat">
      <div class="chap"><span class="glyph" aria-hidden="true">猫</span><div><h2 data-t="cat.title"></h2><p data-t="cat.sub"></p></div></div>
      <div class="g">
        <figure class="c5 a45 m2">
          <div class="frame"><img src="media/cat-lamp.jpg" data-alt="alt.lamp" alt="" loading="lazy" width="1050" height="1400"></div>
          <figcaption><h3 data-t="cat.lamp.t"></h3><p data-t="cat.lamp.d"></p></figcaption>
        </figure>
        <figure class="c7 a75 m2">
          <div class="frame"><img src="media/cat-sleep.jpg" data-alt="alt.sleep" alt="" loading="lazy" width="1400" height="1050"></div>
          <figcaption><h3 data-t="cat.sleep.t"></h3><p data-t="cat.sleep.d"></p></figcaption>
        </figure>
        <figure class="c4 a45">
          <div class="frame"><img src="media/cat-sit.jpg" data-alt="alt.sit" alt="" loading="lazy" width="1050" height="1400"></div>
          <figcaption><h3 data-t="cat.sit.t"></h3><p data-t="cat.sit.d"></p></figcaption>
        </figure>
        <figure class="c4 a45">
          <div class="frame"><img src="media/cat-kitchen.jpg" data-alt="alt.night" alt="" loading="lazy" width="1050" height="1400"></div>
          <figcaption><h3 data-t="cat.night.t"></h3><p data-t="cat.night.d"></p></figcaption>
        </figure>
        <div class="profile c4 m2">
          <h3 data-t="cat.p.title"></h3>
          <dl>
            <div><dt data-t="cat.p.coat.k"></dt><dd data-t="cat.p.coat.v"></dd></div>
            <div><dt data-t="cat.p.skill.k"></dt><dd data-t="cat.p.skill.v"></dd></div>
            <div><dt data-t="cat.p.where.k"></dt><dd data-t="cat.p.where.v"></dd></div>
            <div><dt data-t="cat.p.mood.k"></dt><dd data-t="cat.p.mood.v"></dd></div>
          </dl>
        </div>
      </div>
    </section>

    <!-- KITCHEN -->
    <section id="kitchen">
      <div class="chap"><span class="glyph" aria-hidden="true">食</span><div><h2 data-t="k.title"></h2><p data-t="k.sub"></p></div></div>
      <p class="intro" data-t="k.intro"></p>
      <div class="g">
        <figure class="c8 a85 m2">
          <div class="frame"><img src="media/montblanc.jpg" data-alt="alt.mont" alt="" loading="lazy" width="1400" height="1050"></div>
          <figcaption><h3 data-t="k.mont.t"></h3><p data-t="k.mont.d"></p></figcaption>
        </figure>
        <figure class="c4 a45 k-wing">
          <div class="frame"><img src="media/wings.jpg" data-alt="alt.wings" alt="" loading="lazy" width="1050" height="1400"></div>
          <figcaption><h3 data-t="k.wing.t"></h3><p data-t="k.wing.d"></p></figcaption>
        </figure>
        <figure class="c7 a75 m2 k-laz">
          <div class="frame"><img src="media/laziji.jpg" data-alt="alt.laziji" alt="" loading="lazy" width="745" height="502"></div>
          <figcaption><h3 data-t="k.laz.t"></h3><p data-t="k.laz.d"></p></figcaption>
        </figure>
        <figure class="c5 a45 k-fried">
          <div class="frame"><img src="media/fried.jpg" data-alt="alt.fried" alt="" loading="lazy" width="1400" height="1050"></div>
          <figcaption><h3 data-t="k.fried.t"></h3><p data-t="k.fried.d"></p></figcaption>
        </figure>
      </div>
    </section>

    <!-- SEA -->
    <section id="sea">
      <div class="banner">
        <img src="media/sea.jpg" data-alt="alt.sea" alt="" loading="lazy" width="1050" height="1400">
        <div class="over"><span class="glyph" aria-hidden="true">海</span><div><h2 data-t="sea.title"></h2><p data-t="sea.sub"></p></div></div>
      </div>
      <p class="intro" data-t="sea.intro"></p>
      <div class="g">
        <figure class="c8 a85 m2">
          <div class="frame"><img src="media/madai.jpg" data-alt="alt.madai" alt="" loading="lazy" width="1400" height="1050"></div>
          <div class="spec"><span data-t="sea.madai.s"></span><span class="bin">Pagrus major</span></div>
          <figcaption><h3 data-t="sea.madai.t"></h3><p data-t="sea.madai.d"></p></figcaption>
        </figure>
        <figure class="c4 a45">
          <div class="frame"><img src="media/fugu.jpg" data-alt="alt.fugu" alt="" loading="lazy" width="1050" height="1400"></div>
          <div class="spec"><span data-t="sea.fugu.s"></span><span class="bin">Takifugu sp.</span></div>
          <figcaption><h3 data-t="sea.fugu.t"></h3><p data-t="sea.fugu.d"></p></figcaption>
        </figure>
        <figure class="c4 a45">
          <div class="frame"><img src="media/kasago.jpg" data-alt="alt.kasago" alt="" loading="lazy" width="1050" height="1400"></div>
          <div class="spec"><span data-t="sea.kasago.s"></span><span class="bin">Sebastiscus marmoratus</span></div>
          <figcaption><h3 data-t="sea.kasago.t"></h3><p data-t="sea.kasago.d"></p></figcaption>
        </figure>
        <figure class="c8 a85 m2">
          <div class="frame"><video src="media/snorkel.mp4" poster="media/snorkel-poster.jpg" autoplay muted loop playsinline preload="metadata" data-aria="alt.video"></video></div>
          <div class="spec"><span data-t="sea.snork.s"></span></div>
          <figcaption><h3 data-t="sea.snork.t"></h3><p data-t="sea.snork.d"></p></figcaption>
        </figure>
      </div>
    </section>

    <!-- SNOW + MAHJONG -->
    <div class="duo">
      <section id="snow">
        <div class="chap"><span class="glyph" aria-hidden="true">雪</span><div><h2 data-t="snow.title"></h2><p data-t="snow.sub"></p></div></div>
        <figure class="a45">
          <div class="frame"><img src="media/snow.jpg" data-alt="alt.snow" alt="" loading="lazy" width="1050" height="1400"></div>
          <figcaption><h3 data-t="snow.t"></h3><p data-t="snow.d"></p></figcaption>
        </figure>
      </section>
      <section id="mahjong">
        <div class="chap"><span class="glyph" aria-hidden="true">雀</span><div><h2 data-t="mj.title"></h2><p data-t="mj.sub"></p></div></div>
        <div class="stack">
          <figure class="a169">
            <div class="frame"><img src="media/mahjong.jpg" data-alt="alt.mj" alt="" loading="lazy" width="1400" height="788"></div>
            <figcaption><h3 data-t="mj.t"></h3><p data-t="mj.d"></p></figcaption>
          </figure>
          <div class="invite"><h3 data-t="inv.t"></h3><p data-t="inv.d"></p></div>
        </div>
      </section>
    </div>

  </main>

  <footer>
    <span class="mark">Siyue</span>
    <span data-t="foot"></span>
  </footer>
</div>

<script>
const T = {
  "nav.cat":{zh:"猫",ja:"猫",en:"Cat"},
  "nav.kitchen":{zh:"厨房",ja:"キッチン",en:"Kitchen"},
  "nav.sea":{zh:"海边",ja:"海",en:"Sea"},
  "nav.snow":{zh:"雪山",ja:"雪山",en:"Snow"},
  "nav.mahjong":{zh:"麻将",ja:"麻雀",en:"Mahjong"},

  "hero.eyebrow":{zh:"生活图鉴 · Personal",ja:"生活図鑑 · Personal",en:"A field guide to Siyue"},
  "hero.lede":{

const TITLES = {zh:"思玥的生活图鉴", ja:"シゲツの生活図鑑", en:"Siyue · A field guide"};
const HTML_LANG = {zh:"zh-CN", ja:"ja", en:"en"};

function apply(lang, animate){
  const run = () => {
    document.documentElement.lang = HTML_LANG[lang];
    document.querySelectorAll("[data-t]").forEach(el => { const v = T[el.dataset.t]; if (v) el.textContent = v[lang]; });
    document.querySelectorAll("[data-alt]").forEach(el => { const v = T[el.dataset.alt]; if (v) el.alt = v[lang]; });
    document.querySelectorAll("[data-aria]").forEach(el => { const v = T[el.dataset.aria]; if (v) el.setAttribute("aria-label", v[lang]); });
    document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    document.title = TITLES[lang];
  };
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (animate && !reduce){
    document.body.classList.add("i18n-fade");
    setTimeout(() => { run(); document.body.classList.remove("i18n-fade"); }, 180);
  } else run();
  try { localStorage.setItem("jill-lang", lang); } catch(e) {}
}

function initialLang(){
  const h = (location.hash || "").slice(1);
  if (T["foot"][h]) return h;
  try { const s = localStorage.getItem("jill-lang"); if (s && T["foot"][s]) return s; } catch(e) {}
  const n = (navigator.language || "").toLowerCase();
  if (n.startsWith("zh")) return "zh";
  if (n.startsWith("ja")) return "ja";
  return "en";
}

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => apply(b.dataset.lang, true)));
apply(initialLang(), false);
